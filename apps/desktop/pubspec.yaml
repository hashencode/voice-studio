name: voice2text_desktop
description: Voice2Text macOS-first local meeting workstation.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

resolution: workspace

dependencies:
  companion_protocol: any
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_components:
    path: ../../../flutter-components
  flutter_secure_storage: ^10.3.1
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  meeting_core: any
  meeting_storage: any
  meeting_workflows: any
  path: ^1.9.1
  path_provider: ^2.1.6
  processing_contracts: any
  qr: ^3.0.2
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/processing/frozen_sherpa_macos_arm64.json
    - assets/processing/frozen_sensevoice_macos_arm64.json
